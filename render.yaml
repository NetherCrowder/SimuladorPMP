services:
  - type: web
    name: simulador-pmp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 "app:create_app()"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SIMULADOR_SECRET_KEY
        generateValue: true
